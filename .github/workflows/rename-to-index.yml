name: Rename uploaded file to index.html

on:
  workflow_dispatch:

jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename dating-for-mens.html to index.html
        run: |
          if [ -f dating-for-mens.html ]; then
            git mv dating-for-mens.html index.html
            git config user.name "salamat-ali769"
            git config user.email "salamatalli781@gmail.com"
            git commit -m "Rename dating-for-mens.html to index.html"
            git push
          else
            echo "dating-for-mens.html not found"
            exit 1
          fi
